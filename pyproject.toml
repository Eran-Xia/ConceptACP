[project]
name = "conceptacp"
version = "0.1.0"
description = "A simple project"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
dependencies = [
    "hydra-core",
    "diffusers",
    "torch",
    "ipython",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pillow>=11.2.1",
    "einops>=0.8.1",
    "transformers>=4.52.4",
    "accelerate>=1.7.0",
    "webdataset>=0.2.111",
    "ipywidgets>=8.1.7",
    "pandas>=2.3.3",
]
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
backend-path = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

# Fine-tuning task configuration (full pipeline)

# Data loading
make_data_scale: 1.0  # Must match the scale used during data generation

# Training hyperparameters
batch_size: 32
num_workers: 2
prefetch_factor: 2
gradient_accumulation_steps: 1
use_amp: true  # Automatic mixed precision (fp16)

# Optimizer settings
learning_rate: 0.0001
weight_decay: 0.0

# Training schedule
num_epochs: 100
save_interval: 10  # Save checkpoint every N epochs

# Device settings
device: null  # null = auto-detect CUDA

# Block-level fine-tuning task configuration (efficient)

# Data loading (optimized for performance)
make_data_scale: 1.0  # Must match the scale used during data generation
batch_size: 32
preload_to_gpu: true  # Preload entire dataset to GPU (best for small datasets)
num_workers: 4  # Used only when preload_to_gpu=false
prefetch_factor: 3  # Used only when preload_to_gpu=false
gradient_accumulation_steps: 1
use_amp: true  # Automatic mixed precision (fp16)

# Optimizer settings
learning_rate: 0.0001
weight_decay: 0.0

# Training schedule
num_epochs: 100
save_interval: 10  # Save checkpoint every N epochs

# Device settings
device: null  # null = auto-detect CUDA

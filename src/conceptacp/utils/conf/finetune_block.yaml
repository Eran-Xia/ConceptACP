# Configuration for finetune_block.py
# Composes model, task, unlearn, and paths into flat structure

defaults:
  - model: sdxl  # Override with model=sd15
  - task/finetune_block@_here_
  - unlearn: nudity  # Override with unlearn=object_church, etc.
  - _self_

# Flatten model config into root level
model_path: ${model.model_path}
model_version: ${model.model_version}
d_model: ${model.d_model}
default_resolution: ${model.default_resolution}
num_inference_steps: ${model.num_inference_steps}
sae_checkpoints: ${model.sae_checkpoints}
top_k: ${model.top_k}
code_to_block: ${model.code_to_block}

# Flatten unlearn config into root level
unlearn_type: ${unlearn.unlearn_type}
img_class: ${unlearn.img_class}
code: ${unlearn.code}
lambda_neg_c: ${unlearn.lambda_neg_c}
feature_scales: ${unlearn.feature_scales}

# Task parameters (must be here for file pattern matching)
make_data_scale: 1.0  # Must match the scale used during data generation

# Optional: manually specify data files (overrides automatic glob matching)
forgot_file: null  # e.g., "data/recons/sdxl_nudity/down.2.1_nudity_1.0_block_steps50_interval5.tar.gz"
retain_file: null  # e.g., "data/recons/sdxl_nudity/down.2.1_nudity_retain_block_steps50_interval5.tar.gz"

# Flatten paths into root level
work_dir: ${hydra:runtime.cwd}
retain_prompts: ${work_dir}/data/train_prompts/retain.json
forgot_prompts: ${work_dir}/data/train_prompts/forgot.json
finetune_config_dir: ${work_dir}/data/finetune_config
recons_save_path: ${work_dir}/data/recons/${model_version}_${unlearn_type}
output_path: ${work_dir}/data/output/${model_version}_${unlearn_type}
finetune_model_path: ${work_dir}/models

# Hydra configuration
hydra:
  run:
    dir: ${hydra:runtime.cwd}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

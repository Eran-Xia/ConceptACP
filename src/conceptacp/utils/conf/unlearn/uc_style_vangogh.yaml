# UnlearnCanvas Style Erasure: Van_Gogh
# Example config for erasing Van Gogh style
# Usage:
#   unlearn=uc_style_vangogh unlearncanvas_resources_path=/path/to/UnlearnCanvas_resources
# For other styles:
#   unlearn=uc_style_vangogh unlearn.target_name=Monet unlearncanvas_resources_path=/path

unlearn_type: uc_style_vangogh
target_type: style  # 'style' or 'object'
target_name: Van_Gogh  # The specific style to erase

# img_class is used by legacy code, set to target_name
img_class: ${unlearn.target_name}

# Block to fine-tune (will be auto-selected by feature_select.py)
code: down.2.1

# Loss weight for negative concept (higher = stronger erasure)
lambda_neg_c: 0.2

# Feature scales from automated feature selection
# Will be populated by feature_select.py
feature_scales: {}

